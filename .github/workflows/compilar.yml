name: Compilar ROM hack

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar herramientas
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends binutils-arm-none-eabi libpng-dev build-essential

      - name: Compilar agbcc (compilador del proyecto)
        run: |
          git clone --depth 1 https://github.com/pret/agbcc.git ../agbcc
          cd ../agbcc
          ./build.sh
          ./install.sh "$GITHUB_WORKSPACE"

      - name: Compilar el juego
        run: make -j"$(nproc)"

      - name: Subir ROM
        uses: actions/upload-artifact@v4
        with:
          name: rom-hack
          path: "*.gba"
          retention-days: 14
