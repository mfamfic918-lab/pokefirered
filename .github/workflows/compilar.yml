name: Compilar ROMs por dificultad

# Para descargar las ROMs: pestaña "Actions" > abrir la ejecución más reciente >
# sección "Artifacts" al final de la página.
# Para lanzarla a mano: Actions > "Compilar ROMs por dificultad" > Run workflow.

on:
  push:
    branches: [ master, dificultades ]
  workflow_dispatch:

jobs:
  build:
    name: ROM ${{ matrix.nombre }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dificultad: easy
            nombre: Baja (Ruta Tranquila)
          - dificultad: medium
            nombre: Media (Liga Equilibrada)
          - dificultad: hard
            nombre: Alta (Modo Extremo)
    steps:
      - uses: actions/checkout@v4

      - name: Instalar herramientas
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends binutils-arm-none-eabi libpng-dev build-essential

      - name: Compilar agbcc (compilador del proyecto)
        run: |
          git clone --depth 1 https://github.com/pret/agbcc.git ../agbcc
          cd ../agbcc
          ./build.sh
          ./install.sh "$GITHUB_WORKSPACE"

      - name: Compilar el juego (${{ matrix.dificultad }})
        run: make -j"$(nproc)" DIFFICULTY=${{ matrix.dificultad }}

      - name: Subir ROM
        uses: actions/upload-artifact@v4
        with:
          name: pokefirered-${{ matrix.dificultad }}
          path: pokefirered_${{ matrix.dificultad }}.gba
          if-no-files-found: error
          retention-days: 30
